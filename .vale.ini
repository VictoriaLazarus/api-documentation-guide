StylesPath = .github/styles
MinAlertLevel = warning
Vocab = Docs
Packages = Google, write-good, proselint

[formats]
mdx = md

[*.{md,mdx}]
BasedOnStyles = Vale, Google, write-good, proselint

Google.Acronyms = NO
write-good.E-Prime = NO

# How the guide sounds: voice choices
Google.FirstPerson = NO
Google.We = NO
Google.Will = NO
Google.Contractions = NO
Google.Passive = NO
write-good.Passive = NO

# Noisy or wrong for API documentation
write-good.TooWordy = NO
Google.WordListCase = NO
Google.Headings = NO
Google.Colons = NO
Google.Parens = NO

# Personal style choices
Google.EmDash = NO
proselint.Cliches = NO
proselint.But = NO